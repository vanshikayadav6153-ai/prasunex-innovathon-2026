<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#090d16; font-family:Inter,system-ui,sans-serif;">
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">CAMPUS-NEXUS v2 SYSTEM ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">High-Performance Multitenant Service Topology</text>

  <!-- Presentation Layer -->
  <rect x="50" y="100" width="900" height="120" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="50" y="100" width="8" height="120" rx="4" fill="#3b82f6"/>
  <text x="80" y="130" fill="#60a5fa" font-size="14" font-weight="700">PRESENTATION LAYER (Next.js 14 App Router + Tailwind CSS + Recharts)</text>
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="260" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13">Student Portal (/student/dashboard)</text>
    <rect x="285" y="0" width="260" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="415" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13">Professor Studio (/faculty/dashboard)</text>
    <rect x="570" y="0" width="260" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="700" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13">Admin &amp; Operations (/admin/dashboard)</text>
  </g>

  <!-- API Gateway Layer -->
  <rect x="50" y="245" width="900" height="85" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="50" y="245" width="8" height="85" rx="4" fill="#10b981"/>
  <text x="80" y="275" fill="#34d399" font-size="14" font-weight="700">FASTAPI ASYNC GATEWAY &amp; SECURITY CONTROLS</text>
  <text x="80" y="300" fill="#cbd5e1" font-size="12">JWT (HS256) Multi-Role Auth Guard · Row-Level Security (RLS) on Student Marks · Sliding-Window Rate Limiter</text>
  <text x="80" y="318" fill="#94a3b8" font-size="11">OpenAPI 3.1 Contract Inventory · Prometheus Latency Metrics · Dynamic College Tenant Scoping</text>

  <!-- Algorithmic Modules -->
  <rect x="50" y="355" width="560" height="235" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="50" y="355" width="8" height="235" rx="4" fill="#a855f7"/>
  <text x="80" y="385" fill="#c084fc" font-size="14" font-weight="700">3 CORE ENGINE INNOVATIONS (Python 3.11/3.12)</text>
  
  <g transform="translate(80, 405)">
    <rect x="0" y="0" width="500" height="50" rx="8" fill="#1e293b" stroke="#374151"/>
    <text x="15" y="22" fill="#60a5fa" font-size="12" font-weight="600">Module 1: DKT-Graph Engine (Mastery Map)</text>
    <text x="15" y="40" fill="#94a3b8" font-size="11">7-Node OS Concept DAG · Backward Prerequisite Traversal · Diagnostic Drills</text>

    <rect x="0" y="60" width="500" height="50" rx="8" fill="#1e293b" stroke="#374151"/>
    <text x="15" y="22" fill="#34d399" font-size="12" font-weight="600">Module 2: 2PL IRT Psychometric Studio (Grading Sandbox)</text>
    <text x="15" y="40" fill="#94a3b8" font-size="11">Item Discrimination (a) &amp; Difficulty (b) · Silverman KDE Curve · Undo Ledger</text>

    <rect x="0" y="120" width="500" height="50" rx="8" fill="#1e293b" stroke="#374151"/>
    <text x="15" y="22" fill="#fbbf24" font-size="12" font-weight="600">Module 3: SBERT Grievance Intelligence (Ticket Desk)</text>
    <text x="15" y="40" fill="#94a3b8" font-size="11">384-d Cosine Dedup (≥ 0.82) · SLA Priority W = Base·log2(1+N)·(1+0.1Δt) · Hash-Chain</text>
  </g>

  <!-- Data Layer -->
  <rect x="635" y="355" width="315" height="235" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="635" y="355" width="8" height="235" rx="4" fill="#f59e0b"/>
  <text x="660" y="385" fill="#fbbf24" font-size="14" font-weight="700">PERSISTENCE &amp; STORAGE</text>
  <g transform="translate(660, 405)">
    <rect x="0" y="0" width="265" height="45" rx="8" fill="#1e293b" stroke="#374151"/>
    <text x="15" y="20" fill="#e2e8f0" font-size="12" font-weight="600">PostgreSQL 16 / SQLite</text>
    <text x="15" y="36" fill="#94a3b8" font-size="10">27 Relational Tables + ACID</text>

    <rect x="0" y="55" width="265" height="45" rx="8" fill="#1e293b" stroke="#374151"/>
    <text x="15" y="20" fill="#e2e8f0" font-size="12" font-weight="600">pgvector (HNSW Index)</text>
    <text x="15" y="36" fill="#94a3b8" font-size="10">Fast 384-d Embedding Search</text>

    <rect x="0" y="110" width="265" height="45" rx="8" fill="#1e293b" stroke="#374151"/>
    <text x="15" y="20" fill="#e2e8f0" font-size="12" font-weight="600">Redis 7 (In-Memory)</text>
    <text x="15" y="36" fill="#94a3b8" font-size="10">120s TTL Gradesheet Cache</text>

    <rect x="0" y="165" width="265" height="25" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="132" y="181" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Zero-Config Laptop Fallback</text>
  </g>
</svg>