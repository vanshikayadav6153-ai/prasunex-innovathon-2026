<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#090d16; font-family:Inter,system-ui,sans-serif;">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background overlay -->
  <rect width="1200" height="400" fill="url(#glow)"/>
  <circle cx="1100" cy="80" r="180" fill="#3b82f6" opacity="0.08"/>
  <circle cx="100" cy="320" r="220" fill="#10b981" opacity="0.06"/>

  <!-- Badge -->
  <rect x="460" y="55" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="600" y="76" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1">PRASUNEX INNOVATHON 2026 · ROUND 2</text>

  <!-- Title -->
  <text x="600" y="150" text-anchor="middle" fill="url(#textGrad)" font-size="46" font-weight="900" letter-spacing="-1">CAMPUS-NEXUS v2</text>
  <text x="600" y="195" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="500">Cognitive Operating System for Colleges</text>
  <text x="600" y="230" text-anchor="middle" fill="#94a3b8" font-size="14">12-Week Production MVP: Mastery Map · Grading Sandbox · Ticket Desk</text>

  <!-- Feature Cards -->
  <g transform="translate(150, 275)">
    <rect x="0" y="0" width="270" height="80" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="32" fill="#60a5fa" font-size="14" font-weight="700">01. Mastery Map</text>
    <text x="20" y="56" fill="#94a3b8" font-size="12">DKT-Graph &amp; Prereq DAG</text>

    <rect x="315" y="0" width="270" height="80" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="335" y="32" fill="#34d399" font-size="14" font-weight="700">02. Grading Sandbox</text>
    <text x="335" y="56" fill="#94a3b8" font-size="12">2PL IRT &amp; KDE Curve Audit</text>

    <rect x="630" y="0" width="270" height="80" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="650" y="32" fill="#fbbf24" font-size="14" font-weight="700">03. Ticket Desk</text>
    <text x="650" y="56" fill="#94a3b8" font-size="12">SBERT Dedup &amp; Hash Ledger</text>
