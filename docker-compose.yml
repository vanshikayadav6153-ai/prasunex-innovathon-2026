services:
  db:
    image: pgvector/pgvector:pg16
    container_name: campus_nexus_db
    environment:
      POSTGRES_DB: campus_nexus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev
    ports: ["5432:5432"]
    volumes: ["campus_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_nexus"]
      interval: 5s
      timeout: 3s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: campus_nexus_pgbouncer
    environment:
      DB_USER: campus
      DB_PASSWORD: campus_dev
      DB_HOST: db
      DB_NAME: campus_nexus
      DB_PORT: 5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    ports: ["6432:6432"]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: campus_nexus_redis
    ports: ["6379:6379"]
    volumes: ["campus_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: campus_nexus_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: ["campus_miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: campus_nexus_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin_secret;
      /usr/bin/mc mb --ignore-existing local/campus-grievances;
      /usr/bin/mc mb --ignore-existing local/campus-assets;
      /usr/bin/mc anonymous set download local/campus-grievances;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campus_nexus_api
    environment:
      DATABASE_URL: postgresql+psycopg://campus:campus_dev@pgbouncer:6432/campus_nexus
      DATABASE_FALLBACK_URL: sqlite:///./campus_nexus.db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin_secret
      MINIO_BUCKET_GRIEVANCES: campus-grievances
      JWT_SECRET: local-demo-only-change-before-deployment
      ENVIRONMENT: production
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app/backend
      - campus_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campus_nexus_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://campus:campus_dev@pgbouncer:6432/campus_nexus
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin_secret
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: campus_nexus_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["3000:3000"]
    depends_on:
      - api

volumes:
  campus_pgdata:
  campus_redisdata:
  campus_miniodata:
  campus_uploads:
